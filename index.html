<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),hud=document.getElementById('hud'),tst=document.getElementById('toast');
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
const B=320,R=70,LIM=40,PI=Math.PI,mod=(a,n)=>((a%n)+n)%n,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function blk(i,j){const k=i+','+j;if(BC.has(k))return BC.get(k);
 const h=hsh(i,j),r=n=>((h>>>n)&255)/255,ix=i*B+R/2+42,iy=j*B+R/2+42,N=B-R-84,t=TY[h%12],o={t,h,ix,iy,N,R:[],C:[]};
 const col=n=>{const q=PAL[(h>>>n)%PAL.length];return `hsl(${q[0]+((h>>>(n+3))&15)},${q[1]}%,${q[2]+((h>>>(n+5))&7)}%)`};
 const rc=(x,y,w,hh,n)=>o.R.push({x,y,w,h:hh,col:col(n),ne:NEON[(h>>>n)%5]});
 if(t=='tower'){const m=r(9)*24;rc(ix+m/2,iy+m/2,N-m,N-m,3)}
 else if(t=='twin'){const g2=28,a=(N-g2)*(.4+.2*r(11)),e=(r(13)*20)|0;if(h&1){rc(ix,iy,a,N,3);rc(ix+a+g2,iy+e,N-a-g2,N-e,6)}else{rc(ix,iy,N,a,3);rc(ix+e,iy+a+g2,N-e,N-a-g2,6)}}
 else if(t=='quad'){const g2=26,s2=(N-g2)/2;for(let q=0;q<4;q++)rc(ix+(q%2)*(s2+g2),iy+(q>>1)*(s2+g2),s2,s2-r(q*5+1)*20,3+q*4)}
 else if(t=='L'){const w2=N*.45;if(h&2){rc(ix,iy,N,w2,3);rc(ix,iy,w2,N,6)}else{rc(ix,iy+N-w2,N,w2,3);rc(ix+N-w2,iy,w2,N,6)}}
 else if(t=='round')o.C.push({x:ix+N/2,y:iy+N/2,r:N*.44,col:col(3),ne:NEON[h%5]});
 else if(t=='warehouse')rc(ix,iy+N*.2,N,N*.6,3);
 else if(t=='plaza')o.C.push({x:ix+N/2,y:iy+N/2,r:16,col:'#2a7fff',fount:1});
 else if(t=='garage'){const th=8,gp=52,side=(h>>>7)&3,a=N/2-gp/2;o.gar={x:ix,y:iy,w:N,h:N,th,side,gp};
  const wl=(x,y,w,hh)=>o.R.push({x,y,w,h:hh,col:'#3a3a4c',wall:1});
  if(side==0){wl(ix,iy,a,th);wl(ix+a+gp,iy,N-a-gp,th)}else wl(ix,iy,N,th);
  if(side==1){wl(ix,iy+N-th,a,th);wl(ix+a+gp,iy+N-th,N-a-gp,th)}else wl(ix,iy+N-th,N,th);
  if(side==2){wl(ix,iy,th,a);wl(ix,iy+a+gp,th,N-a-gp)}else wl(ix,iy,th,N);
  if(side==3){wl(ix+N-th,iy,th,a);wl(ix+N-th,iy+a+gp,th,N-a-gp)}else wl(ix+N-th,iy,th,N);
  for(const[u,v]of[[.3,.3],[.7,.3],[.3,.7],[.7,.7]])wl(ix+N*u-5,iy+N*v-5,10,10)}
 BC.set(k,o);return o}
const solid=(x,y)=>{const a=mod(x,B),b=mod(y,B);if(a<R/2+40||a>B-R/2-40||b<R/2+40||b>B-R/2-40)return 0;const o=blk(Math.floor(x/B),Math.floor(y/B));
 for(const q of o.R)if(x>q.x-4&&x<q.x+q.w+4&&y>q.y-4&&y<q.y+q.h+4)return 1;
 for(const c of o.C)if(Math.hypot(x-c.x,y-c.y)<c.r+4)return 1;return 0};
const inGar=(x,y)=>{const a=mod(x,B),b=mod(y,B);if(a<R/2+40||a>B-R/2-40||b<R/2+40||b>B-R/2-40)return 0;const q=blk(Math.floor(x/B),Math.floor(y/B)).gar;return !!q&&x>q.x+q.th&&x<q.x+q.w-q.th&&y>q.y+q.th&&y<q.y+q.h-q.th};
const free=(x,y)=>!solid(x,y),freeC=(x,y)=>!solid(x,y)&&!inGar(x,y);
const surf=(x,y)=>{const a=mod(x,B),b=mod(y,B);if(road(a,b))return 0;return blk(Math.floor(x/B),Math.floor(y/B)).t=='park'?2:1};
const keys={},T={l:0,r:0,u:0,d:0};
addEventListener('keydown',e=>{if(gopen)return;keys[e.key.toLowerCase()]=1;if(e.key==' '||e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();T[k]=1},off=e=>{e.preventDefault();T[k]=0};
b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))});
let time=0,tt=0;const toast=(m,s=2.5)=>{tst.textContent=m;tst.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>tst.style.opacity=0,s*1000)};
const p={x:160,y:18,a:0,v:0,fine:0,clean:0,cd:0,fr:0,inI:false};
const lane=c=>{if(c.dir%2==0)c.y=Math.round(c.y/B)*B+(c.dir==0?18:-18);else c.x=Math.round(c.x/B)*B+(c.dir==1?-18:18)};
function newCop(){let c;for(let t=0;t<30;t++){const ci=Math.round(p.x/B)+((Math.random()*9)|0)-4,cj=Math.round(p.y/B)+((Math.random()*9)|0)-4,h=Math.random()<.5,
dir=h?(Math.random()<.5?0:2):(Math.random()<.5?1:3);
c={x:h?ci*B+(Math.random()-.5)*B:ci*B,y:h?cj*B:cj*B+(Math.random()-.5)*B,dir,chase:0,bt:0,v:170+Math.random()*40,a:dir*PI/2,last:''};lane(c);
if(Math.hypot(c.x-p.x,c.y-p.y)>500)break}return c}

const lt=(i,j,ns)=>{const t=mod(time+((i*7+j*13)&7)*1.5,12);return ns?(t<5?'g':t<6?'y':'r'):(t>=11?'y':t>=6?'g':'r')};
const LC={g:'#2ecc71',y:'#f1c40f',r:'#ff3b3b'};

function viol(msg,fine){if(inGar(p.x,p.y))return;p.clean=0;let best=null,bd=420;for(const c of cops)if(!c.chase){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;best=c}}
if(best){best.chase=1;p.fine+=fine;toast(msg[0].toUpperCase()+msg.slice(1))}}
function bust(i){p.fine+=200;p.v=0;p.fr=2.5;p.clean=0;toast('Busted',2.5);cops[i]=newCop()}
toast('WASD / arrows to drive · Space = handbrake · Obey 40 mph & red lights! Hide in a P garage to lose cops.',6);
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;time+=dt;if(!gopen)update(dt);draw();requestAnimationFrame(loop)}
function update(dt){
 const L=keys.a||keys.arrowleft||T.l,Rr=keys.d||keys.arrowright||T.r,U=keys.w||keys.arrowup||T.u,D=keys.s||keys.arrowdown||T.d;
 if(p.fr>0){p.fr-=dt;p.v=0}else{
  let acc=U?480:0;if(D)acc=p.v>20?-900:-260;
  p.v+=acc*dt-p.v*[1.2,1.3,2.0][surf(p.x,p.y)]*dt;if(keys[' '])p.v*=1-2.5*dt;p.v=clamp(p.v,-150,520);

  if(mv(p,dt))p.v*=Math.pow(.5,dt);
 }
 const mph=Math.abs(p.v)/6;p.clean+=dt;p.cd-=dt;
 const ci=Math.round(p.x/B),cj=Math.round(p.y/B),inI=Math.abs(p.x-ci*B)<R/2&&Math.abs(p.y-cj*B)<R/2;
 if(inI&&!p.inI){const ew=Math.abs(Math.cos(p.a))>Math.abs(Math.sin(p.a));if(lt(ci,cj,!ew)=='r'&&p.v>60)viol('ran a red light',300)}
 p.inI=inI;
 if(mph>LIM+5&&p.cd<=0){p.cd=3;viol('speeding',150)}
 cops.forEach((c,i)=>{const d=Math.hypot(c.x-p.x,c.y-p.y);
  if(c.chase){let df=Math.atan2(p.y-c.y,p.x-c.x)-c.a;df=Math.atan2(Math.sin(df),Math.cos(df));
   c.a+=clamp(df,-3.2*dt,3.2*dt);c.v+=(340-c.v)*1.5*dt;mv(c,dt);
   if(d<50&&!inGar(p.x,p.y))c.bt+=dt;else c.bt=Math.max(0,c.bt-2*dt);
   if(c.bt>1.5)bust(i);else if(d>850){cops[i]=newCop();toast('Lost the cop')}
  }else{const px=c.x,py=c.y;c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
   const h=c.dir%2==0,ci=Math.round(c.x/B),cj=Math.round(c.y/B),cx=(h?ci:cj)*B,pv=h?px:py,nv=h?c.x:c.y,key=ci+','+cj;
   if((pv-cx)*(nv-cx)<=0&&key!==c.last){c.last=key;if(Math.random()<.45){const o=h?[1,3]:[0,2];c.dir=o[Math.random()<.5?0:1];if(h)c.x=ci*B;else c.y=cj*B;lane(c);c.a=c.dir*PI/2}}
   if(d>1500)cops[i]=newCop()}
 });
 const ch=cops.some(c=>c.chase);
 if(inGar(p.x,p.y)){p.hide=(p.hide||0)+dt;if(p.hide>2.5&&ch){cops.forEach((c,i)=>{if(c.chase)cops[i]=newCop()});toast('Lost the cop — hidden!')}}else p.hide=0;
 hud.innerHTML=`<b class="sp" style="color:${mph>LIM+5?'#ff4466':'#7df9ff'}">${mph|0}</b> mph <span class="sign">LIMIT ${LIM}</span><br>FINES $${p.fine}<br>CLEAN ${p.clean|0}s`+(ch?'<br><b style="color:#ff4466">🚨 COP ON YOU</b>':'');
}
const NEON=['#00f0ff','#ff2bd6','#b6ff3b','#ffa31a','#7a5cff'];
const STY={sedan:{L:36,W:18,cx:-1,cl:17},sports:{L:38,W:19,cx:-3,cl:12},hatch:{L:32,W:17,cx:-3,cl:19},truck:{L:42,W:20,cx:7,cl:13,bed:1},van:{L:42,W:20,cx:0,cl:32}};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const DEF={style:'sedan',paint:'#ff2e4d',roof:'#d92848',stripe:'none',stripeCol:'#ffffff',win:'#0c1424',hl:'#fff3b0',tl:'#ff3040',under:'#00ffe6',underOn:true,spoiler:false};
const COPF={style:'sedan',paint:'#161a24',roof:'#161a24',stripe:'none',win:'#0c1424',hl:'#fff3b0',tl:'#ff3040'};
function drawCar(c,f,o){const s=STY[f.style]||STY.sedan,L=s.L,Wd=s.W,hl=L/2,hw=Wd/2;

 if(o.hl){const gr=c.createLinearGradient(hl-2,0,hl+112,0);gr.addColorStop(0,rgba(f.hl,.4));gr.addColorStop(1,rgba(f.hl,0));c.fillStyle=gr;c.beginPath();c.moveTo(hl-2,-6);c.lineTo(hl+112,-40);c.lineTo(hl+112,40);c.lineTo(hl-2,6);c.fill()}

 c.globalCompositeOperation='source-over';
 c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.roundRect(-hl+1,-hw+2,L,Wd,5);c.fill();
 c.fillStyle='#0a0a0a';for(const x of[-L*.3,L*.3])for(const y of[-hw-1.5,hw-1.5])c.fillRect(x-4.5,y,9,3);

 if(f.stripe=='center')c.fillRect(-hl,-1.6,L,3.2);else if(f.stripe=='double'){c.fillRect(-hl,-3.8,L,1.8);c.fillRect(-hl,2,L,1.8)}else if(f.stripe=='side'){c.fillRect(-hl+2,-hw+1,L-4,1.6);c.fillRect(-hl+2,hw-2.6,L-4,1.6)}

function draw(){

 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const bx=i*B+R/2+8,by=j*B+R/2+8,o=blk(i,j),h=o.h,t=o.t;

 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const cx=i*B,cy=j*B,gr=g.createRadialGradient(cx,cy,10,cx,cy,130);gr.addColorStop(0,'rgba(255,210,130,.16)');gr.addColorStop(1,'rgba(255,210,130,0)');g.fillStyle=gr;g.fillRect(cx-130,cy-130,260,260)}

 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const cx=i*B,cy=j*B,a=lt(i,j,0),b=lt(i,j,1);

  dot(cx-R/2-18,cy+R/4,a);dot(cx+R/2+18,cy-R/4,a);dot(cx-R/4,cy-R/2-18,b);dot(cx+R/4,cy+R/2+18,b)}
