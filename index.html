<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),hud=document.getElementById('hud'),tst=document.getElementById('toast'),district=document.getElementById('district');
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
const B=320,R=70,LIM=40,ISLAND=20,PI=Math.PI,mod=(a,n)=>((a%n)+n)%n,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAP_SEED=0x4e435232;
const hsh=(i,j)=>{let h=(Math.imul(i|0,73856093)^Math.imul(j|0,19349663)^MAP_SEED)>>>0;h^=h>>>16;h=Math.imul(h,2246822519)>>>0;h^=h>>>13;return h>>>0};

function storyEscape(v){return String(v||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}

 }else if(story.side){const q=STORY_SIDES.find(x=>x.id===story.side),pt=story.sidePhase==='pickup'?storyPoint(q.sx,q.sy):storyPoint(q.tx,q.ty),d=Math.round(storyDist(pt));html=`<div class="story-head"><div class="story-kicker">OPTIONAL SIDE JOB · ${story.sidePhase==='pickup'?'PICKUP':'DELIVERY'}</div><button class="story-close" data-action="cancelSide">CANCEL</button></div><div class="story-chapter">${q.title}</div><p class="story-desc">${q.desc}</p><div class="story-meta"><span>📍 ${story.sidePhase==='pickup'?q.site:q.target}</span><span>${d}m away</span></div><div class="story-btns">${d<125?`<button class="primary" data-action="sideArrive">${story.sidePhase==='pickup'?'ACCEPT SIDE JOB':'COMPLETE DELIVERY'}</button>`:''}</div>`;

function storyTick(dt){if(!started)return;const sm=storyMarkerData();if(!sm){if(story.ended)storyRender();return}const d=storyDist(sm);if(story.active&&!story.side&&d<105){completeStoryMission();return}if(story.side&&d<105&&story.sidePhase==='delivery'){/* keep the delivery action visible; player confirms */}storyRenderThrottled(dt)}
let storyUiClock=0;function storyRenderThrottled(dt){storyUiClock+=dt;if(storyUiClock>.35){storyUiClock=0;storyRender()}}
function startStoryMission(choiceValue){const m=currentStoryMission();if(!m||story.active||story.ended)return;if(story.index===0&&!String(story.characterName||'').trim()){toast('Choose your character name first.',2.5);return}if(m.choice&&!story.flags[m.choice.key]){if(!choiceValue)return;story.flags[m.choice.key]=choiceValue;if(m.choice.key==='copDeal')story.flags.heat=choiceValue==='expose'?2:0;if(m.choice.key==='crewLead')story.flags.crewTrust=choiceValue==='mechanic'?'mechanic':'driver';if(m.choice.key==='crewRescue')story.flags.finalSupport=choiceValue;if(m.choice.key==='evidencePlan')story.flags.finalPlan=choiceValue}story.active=true;storySave();if(m.kind==='heist'||m.kind==='escape'||m.kind==='chase'||m.kind==='finale'){cops.forEach(c=>{c.chase=1;c.bt=0});if(m.kind==='heist'||m.kind==='finale')requestBackup()}if(m.kind==='escape'||m.kind==='chase')toast('🚨 THE PLAN HAS BECOME A POLICE MATTER.',3);else toast('MISSION STARTED: '+m.title.toUpperCase(),2.5);storyRender()}
function completeStoryMission(){if(!story.active)return;const m=currentStoryMission();story.active=false;story.index++;p.cash+=m.kind==='finale'?50000:1200+story.index*175;if(m.kind==='finale'){story.ended=true;cops.forEach(c=>{c.chase=1;c.bt=0});requestBackup();toast('🏆 STORY COMPLETE · THE CITY WILL NEVER BE NORMAL AGAIN',5)}else toast('MISSION COMPLETE · +$'+(1200+(story.index)*175)+' · CHECKPOINT SAVED',3);storySave();storyRender();drawMap()}
function startSideJob(id){const q=STORY_SIDES.find(x=>x.id===id);if(!q)return;story.side=id;story.sidePhase='pickup';story.sideOpen=false;story.active=false;storySave();toast('SIDE JOB TRACKED: '+q.title,2.5);storyRender()}
function sideArrive(){const q=STORY_SIDES.find(x=>x.id===story.side);if(!q)return;if(story.sidePhase==='pickup'){story.sidePhase='delivery';storySave();toast('SIDE JOB ACCEPTED · '+q.title,2.5)}else{p.cash+=q.reward;if(q.unlock)story.flags.sideCompleted=q.id;story.side=null;story.sidePhase='pickup';storySave();toast('SIDE JOB COMPLETE · +$'+q.reward,3)}storyRender()}

storyPanel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice){startStoryMission(b.dataset.choice);return}if(b.dataset.action==='start'){startStoryMission();return}if(b.dataset.action==='saveName'){const inp=storyPanel.querySelector('#storyNameInput');const v=(inp?.value||'').trim().slice(0,20);if(!v){toast('Enter a name first.',2);return}story.characterName=v;storySave();storyRender();toast('YOUR NAME IS '+v.toUpperCase()+'. MAKE IT LEGENDARY.',3);return}if(b.dataset.action==='sideToggle'){story.sideOpen=!story.sideOpen;storyRender();return}if(b.dataset.action==='cancelSide'){story.side=null;story.sidePhase='pickup';storySave();storyRender();return}if(b.dataset.action==='sideArrive'){sideArrive();return}if(b.dataset.action==='replay'){storyReplay();return}if(b.dataset.side){startSideJob(b.dataset.side);return}});
function drawStoryMarker(){const sm=storyMarkerData();if(!sm||Math.abs(sm.x-p.x)>1200||Math.abs(sm.y-p.y)>1200)return;const pulse=1+Math.sin(time*4)*.15;g.save();g.translate(sm.x,sm.y);const color=sm.kind==='objective'?'#ff5268':'#ffd166';g.globalAlpha=.22;g.fillStyle=color;g.beginPath();g.arc(0,0,37*pulse,0,Math.PI*2);g.fill();g.globalAlpha=1;g.strokeStyle=color;g.lineWidth=3;g.shadowColor=color;g.shadowBlur=18;g.beginPath();g.arc(0,0,25*pulse,0,Math.PI*2);g.stroke();g.fillStyle=color;g.beginPath();g.moveTo(0,-39*pulse);g.lineTo(-8,-25*pulse);g.lineTo(8,-25*pulse);g.closePath();g.fill();g.shadowBlur=0;g.rotate(Math.PI/2+draw.a);g.textAlign='center';g.textBaseline='middle';g.font='800 11px Orbitron,system-ui,sans-serif';g.fillStyle='#07111e';g.fillText(sm.kind==='objective'?'OBJECTIVE':'STORY MISSION',0,1);g.restore()}
