<!DOCTYPE html>
<html>
<head>
    <title>Night Cruiser</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            height: 100%;
            margin: 0;
            background: #10101a;
            overflow: hidden;
            font-family: Orbitron, system-ui, sans-serif;
            color: #fff;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #mm {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 52px);
            right: 10px;
            width: 150px;
            height: 150px;
            background: #10101a; /* Default background, can be changed for rural */
            border: 1px solid rgba(0, 240, 255, .5);
            box-shadow: 0 0 14px rgba(0, 240, 255, .3);
            border-radius: 14px;
            z-index: 2;
        }
        #mm.big {
            top: 50%;
            left: 50%;
            right: auto;
            transform: translate(-50%, -50%);
            width: 86vmin;
            height: 86vmin;
            z-index: 6;
        }
        #ttl {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(8, 8, 24, .45), rgba(0, 0, 0, .93));
            text-align: center;
            transition: opacity 1s;
            cursor: pointer;
        }
        .lg {
            font: 900 clamp(44px, 13vw, 130px) / .95 Orbitron, sans-serif;
            letter-spacing: 0.6; /* This seems like a typo, likely meant for line-height or similar */
            border-radius: 8px;
            padding: 8px 10px;
            margin: 6px 4px 0 0;
            cursor: pointer;
        }
        .sb { /* Assuming style for subtext */
             font-size: clamp(16px, 3vw, 30px);
             margin-top: 10px;
        }
        .pr { /* Assuming style for prompt text */
            font-size: clamp(12px, 2vw, 20px);
            margin-top: 20px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .bar {
            position: absolute;
            background: linear-gradient(to right, rgba(0, 240, 255, .3), rgba(0, 100, 255, .3));
            height: 10px;
            width: 100%;
        }
        #grn, #grd, #cap { /* Placeholder for potential game elements */
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1;
        }
        #gbtn { /* Garage button */
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 240, 255, .5);
            border: none;
            color: #fff;
            font-family: Orbitron, sans-serif;
            cursor: pointer;
            border-radius: 5px;
            z-index: 3;
        }
        #garage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, .9);
            border: 1px solid rgba(0, 240, 255, .5);
            padding: 20px;
            border-radius: 10px;
            z-index: 5;
            display: none; /* Initially hidden */
            text-align: center;
        }
        #garage h3 { margin-top: 0; }
        #garage label { display: block; margin: 10px 0; }
        #garage select, #garage button { margin: 5px; padding: 8px 15px; }
        #garage canvas { background: rgba(0,0,0,.5); margin-bottom: 10px; }
        .tb { /* Control button style */
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, .2);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .tb:active { background: rgba(255, 255, 255, .4); }
        /* Specific control button positioning */
        .tb[data-k="l"] { left: 14px; }
        .tb[data-k="r"] { left: 92px; }
        .tb[data-k="d"] { right: 92px; }
        .tb[data-k="u"] { right: 14px; }
        #tbE, #tbB { /* Additional action buttons */
            bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
        }
        #tbE { right: 14px; }
        #tbB { right: 92px; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <canvas id="mm"></canvas>
    <div id="bld"></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="bst"></div>
    <div id="ttl">
        <div class="lg">NIGHT<br>CRUISER</div>
        <div class="sb">THE CITY NEVER SLEEPS</div>
        <div class="pr">PRESS ANY KEY OR TAP TO START</div>
    </div>
    <div class="bar" style="top:0"></div>
    <div class="bar" style="bottom:0"></div>
    <div id="grn"></div>
    <div id="grd"></div>
    <div id="cap"></div>

    <button id="gbtn">🎨 GARAGE</button>

    <div id="garage">
        <h3>GARAGE</h3>
        <canvas id="prev" width="240" height="200"></canvas>
        <label>Preset<select id="gpre"></select></label>
        <div id="gfields"></div>
        <button id="grand">🎲 RANDOM</button>
        <button id="greset">RESET</button>
        <button id="gclose">CLOSE</button>
    </div>

    <!-- Control Buttons -->
    <div class="tb" data-k="l" style="left:14px">◀</div>
    <div class="tb" data-k="r" style="left:92px">▶</div>
    <div class="tb" data-k="d" style="right:92px">🛑</div>
    <div class="tb" data-k="u" style="right:14px">⛽</div>
    <div class="tb" id="tbE" style="right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px)">🍩</div>
    <div class="tb" id="tbB" style="right:92px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px)">🤝</div>

    <script>
        const cv = document.getElementById('c'), g = cv.getContext('2d'),
              mm = document.getElementById('mm'), mg = mm.getContext('2d'),
              hud = document.getElementById('hud'), tst = document.getElementById('toast'),
              bst = document.getElementById('bst'), ttl = document.getElementById('ttl');

        let W, H;
        const rs = () => {
            W = cv.width = innerWidth;
            H = cv.height = innerHeight;
            // Ensure minimap resizes correctly
            const S = mbig ? Math.round(Math.min(W, H) * .86) : 150;
            if (mm.width !== S) mm.width = mm.height = S;
        };
        addEventListener('resize', rs);
        rs(); // Initial resize

        const B = 320, R = 70, LIM = 40, PI = Math.PI,
              mod = (a, n) => ((a % n) + n) % n,
              clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        const hsh = (i, j) => ((i * 73856093) ^ (j * 19349663)) >>> 0;

        const road = (a, b) => a < R / 2 + 8 || a > B - R / 2 - 8 || b < R / 2 + 8 || b > B - R / 2 - 8;

        // Color palettes. PAL[3] and PAL[6] might be relevant for sandy colors.
        const PAL = [
            [10, 45, 26], [22, 50, 22], [210, 40, 16], [240, 35, 18], // [210,40,16] could be a base for orange
            [190, 45, 15], [280, 35, 17], [30, 30, 22], [0, 0, 22],
            [160, 30, 16]
        ];

        const BC = new Map(), // Building Cache
              TY = [ // Building Types
                  'park', 'tower', 'twin', 'quad', 'L', 'round', 'warehouse', 'plaza',
                  'lot', 'garage', 'houses', 'houses', 'apts', 'apts', 'church',
                  'hospital', 'stadium', 'mall', 'skyscraper', 'skyscraper',
                  'school', 'houses', 'quad', 'garage',
                  // Potentially add 'farmland', 'rural_desert' here
              ],
              HR = ['#5a4038', '#3d3d46', '#6b3a2e', '#4a5240', '#2e3a52', '#6e5b44'], // House roof colors
              GR = { // Ground/Grass colors for specific building types
                  houses: '#0d3320', apts: '#10402a', church: '#1d3a28',
                  school: '#232333', hospital: '#1e2836', mall: '#181824'
              };
              // Add rural colors if needed: e.g., rural_desert: '#a07040'

        // Default parameters for drawing functions (will be populated by game logic)
        let p = {x: 0, y: 0}, // Player position
            time = 0,
            speed = 1,
            cine = false,
            wet = 0,
            flash = 0,
            mbig = false, // Minimap big state
            mf = 0; // Minimap frame counter

        // Placeholder for the main loop function (loop) and other drawing functions
        function loop() {
            // ... game logic and drawing calls ...
            requestAnimationFrame(loop);
        }

        // Function to get building type and properties for a grid cell
        function blk(i, j) {
            const k = i + ',' + j;
            if (BC.has(k)) return BC.get(k);

            const h = hsh(i, j);
            let type = TY[mod(h, TY.length)]; // Get type from hash

            // --- MODIFICATION FOR RURAL AREAS ---
            // Example: If hash suggests a sparse area or a specific rural type
            // This logic would need to be more fleshed out based on desired distribution.
            // For simplicity, let's say if the hash is very low, it's sparse.
            if (h < 10000000) { // Arbitrary threshold for sparseness
                 type = 'lot'; // Or introduce a new 'rural_lot' type
                 // Could also set a specific color tint for these areas
            }
            // --- END MODIFICATION ---

            let colorIdx = mod(h, PAL.length);
            let buildings = [];
            let roofColor = HR[mod(h, HR.length)];
            let groundColor = GR[type] || '#1a2018'; // Default ground color

            // Placeholder for generating specific building structures based on type and hash
            // This part is highly complex and depends on the game's internal structure.
            // For 'mall', 'school', 'hospital', specific drawing logic exists in T60.
            // For general types like 'tower', 'twin', etc., the `blk` function would define their shape/size.

            let buildingData = { type, colorIdx, roofColor, groundColor, buildings };
            BC.set(k, buildingData);
            return buildingData;
        }

        // Function to draw the minimap
        function drawMap() {
            const S = mbig ? Math.round(Math.min(W, H) * .86) : 150;
            if (mm.width !== S) mm.width = mm.height = S;

            const nb = mbig ? 7 : 3; // Number of blocks around player to draw
            const sc = S / (nb * 2 * B); // Scale factor for minimap rendering

            mg.setTransform(1, 0, 0, 1, 0, 0);
            // --- MODIFICATION FOR MINIMAP COLOR SCHEME ---
            // This is a simplified example. A more robust system would color based on 'blk' output.
            // Default background:
            mg.fillStyle = '#2a2a3d'; // Dark grayish-blue background [T57](7)
            mg.fillRect(0, 0, S, S);

            // Attempt to color grid cells based on type (simplified)
            const pi = Math.floor(p.x / B), pj = Math.floor(p.y / B);
            for (let i = pi - nb - 1; i <= pi + nb + 1; i++) {
                for (let j = pj - nb - 1; j <= pj + nb + 1; j++) {
                    const cellData = blk(i, j);
                    let cellColor = '#2a2a3d'; // Default
                    if (cellData.type === 'lot' || cellData.type === 'park') {
                        // Use an orangy-gray sand color for rural/sparse areas
                        cellColor = '#a08060'; // Example sandy color
                    } else if (cellData.type === 'mall') {
                        cellColor = '#181824'; // Dark for mall areas
                    } else if (cellData.type === 'houses' || cellData.type === 'apts') {
                         cellColor = '#0d3320'; // Greenish for residential
                    }
                     // Add more conditions for other types

                    mg.fillStyle = cellColor;
                    mg.fillRect((i - pi + nb) * B * sc, (j - pj + nb) * B * sc, B * sc, B * sc);
                }
            }
             // Draw roads (simplified)
            mg.fillStyle = '#444'; // Road color
            for (let i = pi - nb - 1; i <= pi + nb + 1; i++) {
                for (let j = pj - nb - 1; j <= pj + nb + 1; j++) {
                    if (road(i * B + B / 2, j * B + B / 2)) {
                        mg.fillRect((i - pi + nb) * B * sc, (j - pj + nb) * B * sc, B * sc, B * sc);
                    }
                }
            }

            // Player position marker
            mg.fillStyle = '#ff0';
            mg.beginPath();
            mg.arc(S / 2, S / 2, 5 / sc, 0, PI * 2);
            mg.fill();

            // --- END MODIFICATION ---
        }


        // Simplified draw function structure (based on T60)
        function draw() {
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.fillStyle = '#10101a'; // Background color [T5](2)
            g.fillRect(0, 0, W, H);

            // Draw game world elements based on player position and generated blocks
            const z0 = Math.min(1, (W / B) / 10); // Example zoom factor
            g.translate(W / 2 - p.x * z0, H / 2 - p.y * z0);
            g.scale(z0, z0);

            const pi = Math.floor(p.x / B), pj = Math.floor(p.y / B);
            const nb = Math.ceil(Math.max(W, H) / B) + 2; // Number of blocks to draw around player

            for (let i = pi - nb; i <= pi + nb; i++) {
                for (let j = pj - nb; j <= pj + nb; j++) {
                    const blockData = blk(i, j);
                    const ix = i * B, iy = j * B;
                    const N = B * 0.9; // Building size factor

                    // --- DRAWING LOGIC FOR DIFFERENT AREAS ---
                    if (blockData.type === 'mall') {
                        g.strokeStyle = 'rgba(255,255,255,.28)';
                        g.beginPath();
                        for (let x = ix + 4; x < ix + N; x += 13) {
                            g.moveTo(x, iy + N * .68);
                            g.lineTo(x, iy + N - 4);
                        }
                        g.stroke();
                        const cl = ['#c0392b', '#2e86de', '#bdc3c7', '#f1c40f', '#27ae60'];
                        for (let k = 0; k < 12; k++) {
                            if ((hsh(i, j) >>> k) & 1) { // Use hash for variation
                                g.fillStyle = cl[k % 5];
                                g.beginPath();
                                g.roundRect(ix + 7 + k * 13, iy + N * .68 + 3, 9, 22, 2);
                                g.fill();
                            }
                        }
                    } else if (blockData.type === 'school') {
                        g.fillStyle = '#14502e'; // Greenish base [T60](5)
                        g.beginPath();
                        g.ellipse(ix + N * .34, iy + N * .78, 44, 28, 0, 0, 7);
                        g.fill();
                        g.strokeStyle = '#b0523a'; // Reddish trim [T60](5)
                        g.lineWidth = 4;
                        g.beginPath();
                        g.ellipse(ix + N * .34, iy + N * .78, 40, 24, 0, 0, 7);
                        g.stroke();
                        g.strokeStyle = 'rgba(255,255,255,.4)';
                        g.lineWidth = 1;
                        g.strokeRect(ix + N * .34 - 22, iy + N * .78 - 12, 44, 24);
                    } else if (blockData.type === 'hospital') {
                        g.fillStyle = '#2c3a4e'; // Bluish base [T60](5)
                        g.fillRect(ix + N * .28, iy + N * .62, N * .44, N * .38 + 10);
                    } else if (blockData.type === 'houses' || blockData.type === 'apts') {
                        // Basic house/apartment drawing
                        g.fillStyle = blockData.groundColor;
                        g.fillRect(ix + N * .1, iy + N * .1, N * .8, N * .8);
                        g.fillStyle = blockData.roofColor;
                        g.beginPath();
                        g.moveTo(ix + N * .1, iy + N * .1);
                        g.lineTo(ix + N * .5, iy + N * .05);
                        g.lineTo(ix + N * .9, iy + N * .1);
                        g.closePath();
                        g.fill();
                        // Add more detail like windows etc. based on hash
                    } else if (blockData.type === 'lot' || blockData.type === 'park') {
                        // Drawing for rural/sparse areas (sandy shores)
                        // Use a sandy color palette
                        const sandColor = PAL[3]; // [210, 40, 16] or PAL[6] [280, 35, 17]
                        g.fillStyle = `rgb(${sandColor[0]}, ${sandColor[1]}, ${sandColor[2]})`;
                        g.fillRect(ix, iy, B, B);
                        // Add sparse elements like cacti or rocks if desired
                        // Example: Draw a small rock
                        if (hsh(i, j) % 100 < 5) {
                            g.fillStyle = '#6b5c4c'; // Rock color
                            g.beginPath();
                            g.ellipse(ix + B / 2, iy + B / 2, 8, 12, 0, 0, 7);
                            g.fill();
                        }
                    }
                    // Add drawing logic for other types ('tower', 'twin', etc.)
                    // ...
                }
            }

            // Draw player and other dynamic elements
            // ...

            if ((++mf % (mbig ? 8 : 5)) == 0) drawMap(); // Update minimap periodically [T57](7)
        }

        // Function to handle game start
        function startGame() {
            ttl.style.opacity = 0;
            setTimeout(() => ttl.style.display = 'none', 1000);
            // Initialize game state, start loop
            loop(); // Ensure loop is called
        }

        // Event listeners for game start
        addEventListener('keydown', startGame);
        addEventListener('click', startGame);

        // Initial call to drawMap if needed, or let the loop handle it.
        // drawMap(); // Might be called once on load or when mm state changes.

        // Placeholder for the main loop
        function loop() {
            time += speed;
            // Update game state (player movement, AI, etc.)
            // ...

            draw(); // Draw the current frame

            // Use requestAnimationFrame for smooth animation
            requestAnimationFrame(loop);
        }

        // Initial setup and start
        // Ensure initial draw happens
        addEventListener('load', () => {
           rs(); // Set initial canvas size
           // Initial calls to drawing functions might be needed here or within the loop setup
           // For example, draw initial state of the map elements.
           draw();
           drawMap(); // Draw initial minimap
        });

    </script>
</body>
</html>
